<script>
(function(){
var B=JSON.parse(document.getElementById('blob').textContent);
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(B.s),iterations:B.n,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.i)},key,u8(B.c));
  var text=new TextDecoder().decode(plain);
  document.open();document.write(text);document.close();
}
var KEY='chat-page-pw';
var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
if(saved){open(saved).catch(function(){try{localStorage.removeItem(KEY);}catch(e){}});}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();var pw=document.getElementById('p').value;
  open(pw).then(function(){
    if(document.getElementById('r')&&document.getElementById('r').checked){try{localStorage.setItem(KEY,pw);}catch(e){}}
  }).catch(function(){document.getElementById('err').textContent='Пароль не подошёл';});
});
})();
</script></body></html>
