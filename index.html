const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.data)));
  document.open(); document.write(html); document.close();
}
const saved = localStorage.getItem("drpanel");
if (saved) open(saved).catch(() => localStorage.removeItem("drpanel"));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const pw = document.getElementById("pw").value;
  document.getElementById("err").textContent = "Открываю…";
  try { if (document.getElementById("keep").checked) localStorage.setItem("drpanel", pw); await open(pw); }
  catch { localStorage.removeItem("drpanel"); document.getElementById("err").textContent = "Неверный пароль"; }
});
